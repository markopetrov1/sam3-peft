# LoRA — Vaihingen
# Low-rank adaptation of the image encoder. Train with: python train.py --config configs/lora_vaihingen.yaml

experiment:
  name: lora_vaihingen
  output_dir: experiments
  seed: 1337
  gpu: "0"

dataset:
  type: vaihingen
  root: /path/to/vaihingen_mmseg   # CHANGE THIS to your dataset root
  image_size: 1024
  num_classes: 5                  # informational; inferred from active classes
  augment: true
  exclude_classes: [6]             # exclude clutter (train on 5 classes)

model:
  pretrain_model: vit_b
  sam_checkpoint: null
  method: lora
  rank: 4

training:
  epochs: 50
  batch_size: 2
  num_workers: 4
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  grad_clip_norm: 1.0             # set null or <=0 to disable
  save_every: 5
  val_every: 1
  log_every: 20

resume:
  checkpoint: null
  epoch: 0
