# SAM3 Adapter — Massachusetts Roads
# Train: python train.py --config configs/sam3_adapter_massachusetts_roads.yaml
# Preprocess first: python /path/to/Massachusetts-Roads-Dataset/split.py /path/to/Massachusetts-Roads-Dataset -o /path/to/massachusetts_roads_mmseg

experiment:
  name: sam3_adapter_massachusetts_roads
  output_dir: experiments
  seed: 1337
  gpu: "0"

dataset:
  type: massachusetts_roads
  root: /home/users/aleksandar.s/datasets/massachusetts_roads_mmseg
  image_size: 1008
  num_classes: 2
  augment: true
  exclude_classes: []

model:
  method: sam3_adapter
  sam3_checkpoint: null
  bpe_path: null
  scale_factor: 32
  input_type: fft
  freq_nums: 0.25
  prompt_type: highpass
  tuning_stage: "1234"
  handcrafted_tune: true
  embedding_tune: true
  adaptor: adaptor

training:
  epochs: 50
  batch_size: 24
  num_workers: 4
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 2
  grad_clip_norm: 1.0
  amp: true
  save_every: 5
  val_every: 1
  log_every: 20
  early_stopping_patience: 10

resume:
  checkpoint: null
  epoch: 0
