# SAM LoRA — Vaihingen configuration
# Usage: python train.py --config configs/vaihingen.yaml

experiment:
  name: vaihingen_lora
  output_dir: experiments
  seed: 1337
  gpu: "0"

dataset:
  type: vaihingen
  root: /path/to/vaihingen_mmseg   # CHANGE THIS to your dataset root
  image_size: 1024
  num_classes: 6
  augment: true
  exclude_classes: []

model:
  pretrain_model: vit_b
  sam_checkpoint: null
  rank: 4

training:
  epochs: 50
  batch_size: 2
  num_workers: 4
  lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 1
  save_every: 5
  val_every: 5
  log_every: 20

resume:
  checkpoint: null
  epoch: 0
