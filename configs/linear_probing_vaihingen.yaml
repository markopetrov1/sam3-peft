# Linear probing — Vaihingen
# Frozen encoder + 1×1 conv head. Train with: python train.py --config configs/linear_probing_vaihingen.yaml

experiment:
  name: linear_probing_vaihingen
  output_dir: experiments
  seed: 1337
  gpu: "0"

dataset:
  type: vaihingen
  root: /path/to/vaihingen_mmseg   # CHANGE THIS to your dataset root
  image_size: 1024
  num_classes: 5
  augment: true
  exclude_classes: [6]

model:
  pretrain_model: vit_b
  sam_checkpoint: null
  method: linear_probing

training:
  epochs: 50
  batch_size: 4
  num_workers: 4
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_epochs: 1
  grad_clip_norm: null
  save_every: 5
  val_every: 1
  log_every: 20

resume:
  checkpoint: null
  epoch: 0
